name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Um PR atualizado cancela a execução anterior — não faz sentido pagar minuto
# de runner por um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Validação do Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Formatação
        run: terraform fmt -check -recursive
        working-directory: terraform

      # -backend=false: valida sem credencial da AWS e sem tocar no state do S3.
      - name: Init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Validate
        run: terraform validate
        working-directory: terraform

      # Trava o nível atual: hoje passa limpo em MEDIUM+.
      #   skip-dirs  → o cache .terraform traz os YAML de EXEMPLO dos módulos
      #                da comunidade, que não são nosso código.
      #   trivyignore → decisões conscientes, cada uma com o porquê no arquivo.
      - name: Scan de misconfiguração (trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform
          skip-dirs: terraform/.terraform
          trivyignores: terraform/.trivyignore
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
