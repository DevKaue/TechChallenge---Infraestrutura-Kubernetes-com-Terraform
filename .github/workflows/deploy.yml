name: deploy

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  id-token: write
  contents: read

env:
  TF_ACTIONS_WORKING_DIR: ./terraform
  ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  BACKEND_KEY: ${{ github.ref == 'refs/heads/main' && 'k8s/prod/terraform.tfstate' || 'k8s/staging/terraform.tfstate' }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: configure aws (oidc)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-duration-seconds: 1200

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10.0"

      - name: terraform init (plan)
        run: terraform init -input=false -backend-config="bucket=techchallenge-fiap-v1" -backend-config="key=${{ env.BACKEND_KEY }}" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: terraform plan
        run: terraform plan -var "environment=${{ env.ENV_NAME }}" -out=tfplan

      - name: textual plan
        run: terraform show -no-color tfplan > ../tfplan.txt

      - name: comment plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const plan = fs.readFileSync('tfplan.txt', 'utf8')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Terraform Plan\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``
            })

  apply:
    name: terraform apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: ${{ env.TF_ACTIONS_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: configure aws (oidc)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10.0"

      - name: terraform init (apply)
        run: terraform init -input=false -lock=true -backend-config="bucket=techchallenge-fiap-v1" -backend-config="key=${{ env.BACKEND_KEY }}" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: terraform apply
        run: terraform apply -var "environment=${{ env.ENV_NAME }}" -auto-approve -input=false