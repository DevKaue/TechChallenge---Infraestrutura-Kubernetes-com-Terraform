name: Deploy (Terraform)

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Um apply por ambiente. NÃO cancela o anterior: matar um `terraform apply` no
# meio deixa o state e a infra em estado inconsistente.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # troca o token OIDC do Actions por credencial temporária da AWS
  contents: read

env:
  # develop → homologação | main → produção
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

jobs:
  apply:
    name: Apply (${{ github.ref_name == 'main' && 'produção' || 'homologação' }})
    runs-on: ubuntu-latest
    # Environments do GitHub: 'production' pode exigir aprovação manual em
    # Settings → Environments. 'homolog' costuma ser livre.
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}

    defaults:
      run:
        working-directory: terraform

    env:
      TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
      # Cada ambiente tem seu próprio state — homolog e prod não se sobrescrevem.
      TF_VAR_db_state_key: ${{ github.ref_name == 'main' && 'db/prod/terraform.tfstate' || 'db/homolog/terraform.tfstate' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      # Sem AWS_ACCESS_KEY_ID em secret: o Actions apresenta seu token OIDC e a
      # role confia apenas em `repo:<owner>/<repo>:*` (ver terraform/github-oidc.tf).
      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # O backend S3 é declarado em versions.tf; aqui só troca o key por ambiente.
      - name: Terraform init
        run: terraform init -input=false -backend-config="key=${{ env.ENVIRONMENT }}/terraform.tfstate"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Terraform apply"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`${{ env.ENVIRONMENT }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
